name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Version in Configs
        run: |
          # Strip leading 'v' from tag name for internal versioning
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/version=\".*\"/version=\"$VERSION\"/" addons/ambientcg/plugin.cfg
          sed -i "s/const VERSION = \".*\"/const VERSION = \"$VERSION\"/" addons/ambientcg/core/ambient_config.gd

      - name: Zip Addon
        run: |
          zip -r godot-ambientcg-${{ github.ref_name }}.zip addons/ambientcg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: godot-ambientcg-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}