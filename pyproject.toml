[project]
name = "godot-ambientcg"
version = "0.1.0"
description = "AmbientCG"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "gdtoolkit>=4.5.0",
    "taskipy>=1.12.0",
]

[tool.taskipy.tasks]
check = "python scripts/check.py"
format = "gdformat addons/ambientcg/ tests/"
format-check = "gdformat --check addons/ambientcg/ tests/"
lint = "gdlint addons/ambientcg/ tests/"
test = "python scripts/test.py"
clean = "python scripts/clean.py"
dev = "python scripts/dev.py"
version = "python scripts/get_godot_version.py"

[tool.uv]
package = false
